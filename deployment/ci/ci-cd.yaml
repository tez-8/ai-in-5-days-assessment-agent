name: Enterprise AgentOps CI/CD & Evaluation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  quality-and-rubric-verification:
    name: Static Lint, Rubric Unit Tests & Golden Dataset Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter
        run: uv run ruff check app tests

      - name: Run Automated Rubric Compliance & Evaluation Suite
        env:
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT || 'enterprise-it-helpdesk-sandbox' }}
          ENABLE_SECRET_MANAGER_LOOKUP: "false"
        run: uv run pytest tests/unit tests/integration -v

  terraform-validate:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest
    needs: quality-and-rubric-verification
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: deployment/terraform/single-project
        run: terraform fmt -check

  deploy-agent-runtime:
    name: Deploy to Gemini Platform Agent Runtime via agents-cli
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_WORKLOAD_IDENTITY_PROVIDER != ''
    runs-on: ubuntu-latest
    needs: [quality-and-rubric-verification, terraform-validate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Install uv & agents-cli
        uses: astral-sh/setup-uv@v5

      - name: Deploy Agent to Agent Runtime
        run: |
          uv tool install google-agents-cli
          agents-cli deploy \
            --project "${{ vars.GOOGLE_CLOUD_PROJECT }}" \
            --region "${{ vars.GOOGLE_CLOUD_REGION || 'us-central1' }}" \
            --no-confirm-project
          agents-cli eval --dataset tests/eval/datasets/golden_dataset.json
